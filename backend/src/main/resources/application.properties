server.port=${BACKEND_PORT:8080}

app.supabase.url=${SUPABASE_URL}
app.supabase.anon-key=${SUPABASE_ANON_KEY}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.web-url=${WEB_URL:http://localhost:5173}
app.cors.allowed-origins=${BACKEND_ALLOWED_ORIGINS:http://localhost:5173}
app.sunat.url=${SUNAT_API_URL:}
app.sunat.token=${SUNAT_API_TOKEN:}
app.sunat.timeout-ms=${SUNAT_TIMEOUT_MS:8000}

# Valida los JWT emitidos por Supabase Auth (claves de firma publicadas en JWKS)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
logging.level.pe.contadoreseirl=INFO
